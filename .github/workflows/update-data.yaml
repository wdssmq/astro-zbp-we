name: Update Content Collections

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch and generate Markdown
        run: python scripts/fetch_data.py

      # - name: Install pnpm
      #   uses: pnpm/action-setup@v5
      #   with:
      #     version: 10

      # - name: Set up Node.js
      #   uses: actions/setup-node@v5
      #   with:
      #     node-version: 22
      #     cache: pnpm

      # - name: Install and build
      #   run: |
      #     pnpm install --frozen-lockfile
      #     pnpm build

      - name: Commit generated content
        run: |
          if [[ -z "$(git status --porcelain -- src/content/issues)" ]]; then
            echo "No content changes."
            exit 0
          fi
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add src/content/issues
          git commit -m "chore: update issue content"
          git push
